<section class="page-banner" [style.background-image]="'linear-gradient(90deg, rgba(9, 118, 185, 0.82), rgba(0, 185, 232, 0.38)), url(' + image + ')'">
  <div class="container banner-content" appReveal="up">
    <span class="eyebrow">Jeevan Foundation Trust</span>
    <h1>{{ title }}</h1>
    <p *ngIf="description">{{ description }}</p>
  </div>
</section>
